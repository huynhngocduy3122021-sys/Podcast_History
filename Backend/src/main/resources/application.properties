spring.application.name=podcast-history-backend
spring.profiles.default=dev
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Podcast_History}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${MEDIA_UPLOAD_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MEDIA_UPLOAD_MAX_FILE_SIZE:100MB}
springdoc.swagger-ui.path=/swagger-ui.html
features.creator-plans-enabled=${CREATOR_PLANS_ENABLED:false}
features.memberships-enabled=${MEMBERSHIPS_ENABLED:false}
security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:600}
security.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.region=${R2_REGION:auto}
r2.folder=${R2_FOLDER:podcast-history}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.moderation-model=${GEMINI_MODERATION_MODEL:gemini-3.5-flash}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
gemini.auto-approve-confidence-threshold=${GEMINI_AUTO_APPROVE_CONFIDENCE_THRESHOLD:0.90}
whisper.service-url=${WHISPER_SERVICE_URL:http://127.0.0.1:8092}
whisper.service-token=${WHISPER_SERVICE_TOKEN:}
agora.app-id=${AGORA_APP_ID:}
agora.app-certificate=${AGORA_APP_CERTIFICATE:}
agora.token-ttl-seconds=${AGORA_TOKEN_TTL_SECONDS:3600}
